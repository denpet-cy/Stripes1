<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$STRIPES: Neon Herd Run Arcade</title>
    <style>
        :root {
            --bg-color: #07070c;
            --card-bg: #11111d;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-purple: #9d00ff;
            --text-main: #ffffff;
            --text-muted: #a0a0c0;
            --border-color: #262642;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 0, 127, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .header-nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .back-btn {
            background: var(--card-bg);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .game-title {
            color: var(--neon-cyan);
            font-size: 1.2rem;
            font-weight: 900;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 60vh;
            background: #05050a;
            border: 1px solid var(--neon-cyan);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            display: block;
        }

        /* Controls Section */
        .controls-panel {
            width: 100%;
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .touch-btn {
            background: #0c0c14;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .touch-btn:active {
            background: var(--neon-cyan);
            color: #000;
        }

        .touch-btn.boost {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            grid-column: span 2;
        }

        .touch-btn.boost:active {
            background: var(--neon-pink);
            color: #000;
        }

        .instructions {
            width: 100%;
            max-width: 800px;
            background: rgba(17, 17, 29, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="index.html" class="back-btn">← Back to Site</a>
        <div class="game-title">🦓 NEON HERD RUN</div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- Touch Mobile Controls -->
        <div class="controls-panel">
            <div class="touch-btn" onclick="handleTap()">⬆️ JUMP</div>
            <div class="touch-btn" onclick="handleSlide()">⬇️ SLIDE</div>
            <div class="touch-btn boost" onclick="handleBoost()">⚡ HYPER BOOST</div>
        </div>
    </div>

    <div class="instructions">
        <strong style="color: var(--neon-pink);">How to play:</strong> Tap <strong>JUMP</strong> to hop over lasers, <strong>SLIDE</strong> under drones, and collect $STRIPES Orbs to charge your <strong>HYPER BOOST</strong>!
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let boostPower = 0;
        let isBoosting = false;
        let frame = 0;

        // Player (Zebra Runner)
        const player = {
            x: 80,
            y: 280,
            width: 40,
            height: 50,
            velocityY: 0,
            gravity: 0.8,
            isJumping: false,
            isSliding: false,
            slideTimer: 0
        };

        let obstacles = [];
        let orbs = [];

        function drawBackground() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Neon Grid Floor
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, 330);
            ctx.lineTo(800, 330);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo((i - (frame * 4 % 40)), 330);
                ctx.lineTo((i - (frame * 8 % 40)) - 100, 400);
                ctx.stroke();
            }
        }

        function drawPlayer() {
            ctx.save();
            if (player.isSliding) {
                ctx.fillStyle = '#ff007f';
                ctx.fillRect(player.x, player.y + 25, player.width + 10, player.height - 25);
            } else {
                // Cyber ZEBRA
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.fillStyle = '#000000';
                ctx.fillRect(player.x + 8, player.y, 6, player.height);
                ctx.fillRect(player.x + 22, player.y, 6, player.height);
                
                // Cyber Visor
                ctx.fillStyle = '#00f3ff';
                ctx.fillRect(player.x + 20, player.y + 8, 18, 8);
            }
            ctx.restore();
        }

        function updatePlayer() {
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            if (player.y > 280) {
                player.y = 280;
                player.velocityY = 0;
                player.isJumping = false;
            }

            if (player.isSliding) {
                player.slideTimer--;
                if (player.slideTimer <= 0) {
                    player.isSliding = false;
                }
            }
        }

        function spawnObstacle() {
            if (frame % 90 === 0) {
                const type = Math.random() > 0.5 ? 'laser' : 'drone';
                obstacles.push({
                    x: 800,
                    y: type === 'laser' ? 290 : 230,
                    width: 20,
                    height: 40,
                    type: type
                });
            }
        }

        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= isBoosting ? 12 : 6;

                // Draw Obstacle
                ctx.fillStyle = obstacles[i].type === 'laser' ? '#ff007f' : '#9d00ff';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 10;
                ctx.fillRect(obstacles[i].x, obstacles[i].y, obstacles[i].width, obstacles[i].height);
                ctx.shadowBlur = 0;

                // Collision
                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    if (!isBoosting) {
                        gameState = 'GAMEOVER';
                    }
                }

                if (obstacles[i].x < -50) obstacles.splice(i, 1);
            }
        }

        function drawUI() {
            ctx.fillStyle = '#00f3ff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('SCORE: ' + score, 20, 30);

            // Start Screen Overlay
            if (gameState === 'START') {
                ctx.fillStyle = 'rgba(7, 7, 12, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00f3ff';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🦓 $STRIPES: NEON HERD RUN', canvas.width / 2, 160);

                ctx.fillStyle = '#ff007f';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('[ TAP HERE TO START RUN ]', canvas.width / 2, 220);
                ctx.textAlign = 'left';
            } else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(7, 7, 12, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff007f';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('💥 RUN ENDED', canvas.width / 2, 160);
                ctx.fillStyle = '#ffffff';
                ctx.font = '18px sans-serif';
                ctx.fillText('FINAL SCORE: ' + score, canvas.width / 2, 200);

                ctx.fillStyle = '#00f3ff';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('[ TAP TO RESTART ]', canvas.width / 2, 250);
                ctx.textAlign = 'left';
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            if (gameState === 'PLAYING') {
                frame++;
                score += 1;
                updatePlayer();
                spawnObstacle();
                updateObstacles();
                drawPlayer();
            }

            drawUI();
            requestAnimationFrame(gameLoop);
        }

        function handleTap() {
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                score = 0;
                obstacles = [];
                gameState = 'PLAYING';
            } else if (gameState === 'PLAYING' && !player.isJumping) {
                player.velocityY = -13;
                player.isJumping = true;
            }
        }

        function handleSlide() {
            if (gameState === 'PLAYING') {
                player.isSliding = true;
                player.slideTimer = 25;
            }
        }

        function handleBoost() {
            if (gameState === 'PLAYING') {
                isBoosting = true;
                setTimeout(() => { isBoosting = false; }, 2000);
            }
        }

        canvas.addEventListener('click', handleTap);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleTap();
            if (e.code === 'ArrowDown') handleSlide();
        });

        gameLoop();
    </script>
</body>
</html>
