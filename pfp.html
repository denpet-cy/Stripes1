<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$STRIPES Cyberpunk PFP Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #08090c;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px 10px;
      margin: 0;
    }
    h1 {
      color: #00ffcc;
      font-size: 26px;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
      margin-bottom: 5px;
    }
    p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    
    .card {
      background: #111319;
      border: 1px solid #1f2430;
      border-radius: 16px;
      padding: 15px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #canvas-container {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      background: #000;
      display: block;
    }

    .inputs { display: flex; flex-direction: column; gap: 12px; }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #00ffcc;
      background: #090a0f;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .btn {
      background: linear-gradient(135deg, #00ffcc, #ff007f);
      border: none;
      color: #000;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn-download { background: #00ffcc; color: #000; }
  </style>
</head>
<body>

  <h1>$STRIPES PFP GENERATOR</h1>
  <p>Kies een Cyberpunk Zebra & voeg je naam toe!</p>

  <div class="card">
    <div id="canvas-container">
      <canvas id="pfpCanvas" width="800" height="800"></canvas>
    </div>

    <div class="inputs">
      <input type="text" id="userHandle" placeholder="Voer je @handle in" value="@STRIPES" oninput="drawPFP()">
      <button class="btn" onclick="nextZebra()">⚡ Verander Zebra Stijl</button>
      <button class="btn btn-download" onclick="downloadPFP()">💾 Download HQ PFP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('pfpCanvas');
    const ctx = canvas.getContext('2d');

    // Betrouwbare Cyberpunk Zebra HQ afbeeldingen
    const zebraImages = [
      'https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?q=80&w=800&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1526095179574-86e5458425de?q=80&w=800&auto=format&fit=crop',
      'https://images.unsplash.com/photo-1501705388883-4ed8a543392c?q=80&w=800&auto=format&fit=crop'
    ];

    let currentIdx = 0;
    let loadedImg = new Image();

    function loadZebraImage(url) {
      loadedImg = new Image();
      loadedImg.crossOrigin = "anonymous";
      loadedImg.src = url;
      loadedImg.onload = function() {
        drawPFP();
      };
    }

    function drawPFP() {
      if (!loadedImg.complete) return;

      // 1. Draw Image
      ctx.drawImage(loadedImg, 0, 0, 800, 800);

      // 2. Cyberpunk Color Overlay (Neon Pink & Cyan glow)
      ctx.fillStyle = 'rgba(0, 255, 204, 0.08)';
      ctx.fillRect(0, 0, 800, 800);

      // 3. Dark Bottom Gradient for text readability
      const gradient = ctx.createLinearGradient(0, 500, 0, 800);
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, 'rgba(8, 9, 12, 0.9)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 500, 800, 300);

      // 4. Neon Cyber Frame
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 14;
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#00ffcc';
      ctx.strokeRect(12, 12, 776, 776);

      // 5. Branding Badge ($STRIPES)
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 38px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('$STRIPES', 40, 70);

      // 6. User Handle Text
      const handleText = document.getElementById('userHandle').value || '@STRIPES';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffcc';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(handleText, 400, 730);

      // Reset shadows
      ctx.shadowBlur = 0;
    }

    function nextZebra() {
      currentIdx = (currentIdx + 1) % zebraImages.length;
      loadZebraImage(zebraImages[currentIdx]);
    }

    function downloadPFP() {
      const link = document.createElement('a');
      link.download = 'stripes-cyberpunk-pfp.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Start direct bij laden
    window.onload = function() {
      loadZebraImage(zebraImages[0]);
    };
  </script>

</body>
</html>
