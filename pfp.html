<script>
    async function generatePFP() {
        const extra = document.getElementById('extra').value;
        const resDiv = document.getElementById('result');
        resDiv.innerHTML = "Bezig met genereren in cyberpunk neon stijl... Even geduld! 🎨";

        try {
            // Roept de beveiligde backend functie aan op Vercel
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: extra })
            });

            const data = await response.json();
            
            if (data.output && data.output.length > 0) {
                const imgUrl = data.output[0];
                resDiv.innerHTML = `
                    <img src="${imgUrl}" alt="Cyberpunk Zebra PFP" style="width:100%; border-radius:12px; margin-top:10px; border:2px solid #00f0ff;">
                    <br><br>
                    <a href="${imgUrl}" target="_blank" download="cyberpunk-zebra-pfp.jpg">
                        <button style="background:#ff007f;color:#fff; padding:12px; border-radius:8px; border:none; font-weight:bold; cursor:pointer;">Download PFP</button>
                    </a>
                `;
            } else {
                resDiv.innerHTML = "Er is iets misgegaan bij het genereren. Probeer het opnieuw.";
            }
        } catch (error) {
            resDiv.innerHTML = "Fout bij verbinden met de server.";
            console.error(error);
        }
    }
</script>
