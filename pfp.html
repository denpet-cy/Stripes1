<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$STRIPES Cyberpunk Zebra PFP Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #08090c;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px 10px;
      margin: 0;
    }
    h1 {
      color: #00ffcc;
      font-size: 26px;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
      margin-bottom: 5px;
    }
    p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    
    .card {
      background: #111319;
      border: 1px solid #1f2430;
      border-radius: 16px;
      padding: 15px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #canvas-container {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
      background: #000;
      display: block;
    }

    .inputs { display: flex; flex-direction: column; gap: 10px; }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #00ffcc;
      background: #090a0f;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      background: linear-gradient(135deg, #00ffcc, #ff007f);
      border: none;
      color: #000;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #1f2430; color: #00ffcc; border: 1px solid #00ffcc; }
    .btn-download { background: #00ffcc; color: #000; width: 100%; margin-top: 5px; }

    .counter {
      color: #00ffcc;
      font-weight: bold;
      margin: 5px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>$STRIPES PFP GENERATOR</h1>
  <p>Kies uit 50 unieke Cyberpunk Neon Zebra's!</p>

  <div class="card">
    <div id="canvas-container">
      <canvas id="pfpCanvas" width="800" height="800"></canvas>
    </div>

    <div class="counter" id="styleCounter">Zebra Stijl 1 van 50</div>

    <div class="inputs">
      <input type="text" id="userHandle" placeholder="Voer je @handle in" value="@STRIPES" oninput="drawPFP()">
      
      <div class="nav-buttons">
        <button class="btn btn-secondary" onclick="prevZebra()">◀ Vorige</button>
        <button class="btn" onclick="randomZebra()">🎲 Willekeurig</button>
        <button class="btn btn-secondary" onclick="nextZebra()">Volgende ▶</button>
      </div>

      <button class="btn btn-download" onclick="downloadPFP()">💾 Download HQ PFP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('pfpCanvas');
    const ctx = canvas.getContext('2d');

    const TOTAL_ZEBRAS = 50;
    let currentIdx = 1;
    let loadedImg = new Image();

    function loadZebraImage(index) {
      document.getElementById('styleCounter').innerText = `Zebra Stijl ${index} van ${TOTAL_ZEBRAS}`;
      
      // Specifieke AI-prompt gericht op een Cyberpunk Neon Zebra met unieke seed per nummer
      const prompt = encodeURIComponent(`cyberpunk zebra portrait style ${index}, glowing neon circuit stripes, futuristic cyber visor, dark rainy neon city background, cyan and pink neon lighting, 8k, highly detailed profile picture`);
      const aiUrl = `https://image.pollinations.ai/prompt/${prompt}?seed=${index * 123}&width=800&height=800&nologo=true`;

      loadedImg = new Image();
      loadedImg.crossOrigin = "anonymous";
      loadedImg.src = aiUrl;
      
      loadedImg.onload = function() {
        drawPFP();
      };
    }

    function drawPFP() {
      if (!loadedImg.complete) return;

      // 1. Teken de AI Cyberpunk Zebra
      ctx.drawImage(loadedImg, 0, 0, 800, 800);

      // 2. Donkere verlooplaag onderaan voor tekstleesbaarheid
      const gradient = ctx.createLinearGradient(0, 500, 0, 800);
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, 'rgba(8, 9, 12, 0.9)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 500, 800, 300);

      // 3. Neon Cyber Frame
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 14;
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#00ffcc';
      ctx.strokeRect(12, 12, 776, 776);

      // 4. Branding Badge ($STRIPES)
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff007f';
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 38px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('$STRIPES', 40, 70);

      // 5. User Handle Tekst
      const handleText = document.getElementById('userHandle').value || '@STRIPES';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffcc';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(handleText, 400, 730);

      ctx.shadowBlur = 0;
    }

    function nextZebra() {
      currentIdx = currentIdx >= TOTAL_ZEBRAS ? 1 : currentIdx + 1;
      loadZebraImage(currentIdx);
    }

    function prevZebra() {
      currentIdx = currentIdx <= 1 ? TOTAL_ZEBRAS : currentIdx - 1;
      loadZebraImage(currentIdx);
    }

    function randomZebra() {
      currentIdx = Math.floor(Math.random() * TOTAL_ZEBRAS) + 1;
      loadZebraImage(currentIdx);
    }

    function downloadPFP() {
      const link = document.createElement('a');
      link.download = `stripes-cyberpunk-zebra-${currentIdx}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Laad direct de eerste cyberpunk zebra bij openen
    window.onload = function() {
      loadZebraImage(1);
    };
  </script>

</body>
</html>
