<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$STRIPES Cyberpunk PFP Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060709;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px 10px;
    }
    h1 {
      color: #00ffcc;
      font-size: 26px;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
      margin-bottom: 6px;
    }
    p { color: #8899a6; font-size: 14px; margin-bottom: 20px; }
    
    .card {
      background: #0f1117;
      border: 1px solid #1f2430;
      border-radius: 18px;
      padding: 16px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
    }

    #canvas-container {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
      background: #000;
      display: block;
    }

    .counter {
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .inputs { display: flex; flex-direction: column; gap: 10px; }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #00ffcc;
      background: #08090d;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .nav-buttons { display: flex; gap: 8px; }

    .btn {
      flex: 1;
      background: linear-gradient(135deg, #00ffcc, #ff007f);
      border: none;
      color: #000;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: #181b24; color: #00ffcc; border: 1px solid #00ffcc; }
    .btn-download { background: #00ffcc; color: #000; width: 100%; font-size: 16px; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>$STRIPES PFP GENERATOR</h1>
  <p>Kies jouw unieke Cyberpunk Neon Zebra avatar!</p>

  <div class="card">
    <div id="canvas-container">
      <canvas id="pfpCanvas" width="800" height="800"></canvas>
    </div>

    <div class="counter" id="styleCounter">Laden van Zebra 1 van 50...</div>

    <div class="inputs">
      <input type="text" id="userHandle" placeholder="Voer je @handle in" value="@STRIPES" oninput="drawPFP()">
      
      <div class="nav-buttons">
        <button class="btn btn-secondary" onclick="changeStyle(-1)">◀ Vorige</button>
        <button class="btn" onclick="randomStyle()">🎲 Random</button>
        <button class="btn btn-secondary" onclick="changeStyle(1)">Volgende ▶</button>
      </div>

      <button class="btn btn-download" onclick="downloadPFP()">💾 Download HQ PFP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('pfpCanvas');
    const ctx = canvas.getContext('2d');
    const TOTAL_STYLES = 50;
    let currentStyle = 1;
    let loadedImg = new Image();

    function loadZebraImage(index) {
      document.getElementById('styleCounter').innerText = `Zebra Stijl ${index} van ${TOTAL_STYLES}`;
      
      // Teken tijdelijk een donker laadscherm
      ctx.fillStyle = '#060709';
      ctx.fillRect(0, 0, 800, 800);
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 30px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(`Laden van Zebra ${index}...`, 400, 400);

      // Strikte AI Prompt: Uitsluitend Zebra's, GEEN mensen of andere dieren
      const prompt = encodeURIComponent(`head portrait of a zebra, glowing neon purple and cyan circuit stripes, cyberpunk visor, dark neon city background, highly detailed animal portrait, 8k`);
      const negative = encodeURIComponent(`human, person, woman, man, girl, boy, lion, tiger, cat, dog, face, female, male`);
      
      // Unieke seed per stijl (1 t/m 50)
      const aiUrl = `https://image.pollinations.ai/prompt/${prompt}?negative=${negative}&seed=${index * 4321}&width=800&height=800&nologo=true`;

      loadedImg = new Image();
      loadedImg.crossOrigin = "anonymous";
      loadedImg.src = aiUrl;

      loadedImg.onload = function() {
        drawPFP();
      };
    }

    function drawPFP() {
      if (!loadedImg.complete) return;

      // 1. Teken de AI Afbeelding
      ctx.drawImage(loadedImg, 0, 0, 800, 800);

      // 2. Neon Cyber Frame
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 14;
      ctx.strokeRect(10, 10, 780, 780);

      // 3. Donkere verlooplaag onderaan voor de tekst
      const grad = ctx.createLinearGradient(0, 550, 0, 800);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(6, 7, 9, 0.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 550, 800, 250);

      // 4. Branding Badge ($STRIPES)
      ctx.fillStyle = '#ff007f';
      ctx.font = '900 38px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('$STRIPES', 40, 70);

      // 5. Custom User Handle
      const handle = document.getElementById('userHandle').value || '@STRIPES';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(handle, 400, 730);
    }

    function changeStyle(delta) {
      currentStyle += delta;
      if (currentStyle > TOTAL_STYLES) currentStyle = 1;
      if (currentStyle < 1) currentStyle = TOTAL_STYLES;
      loadZebraImage(currentStyle);
    }

    function randomStyle() {
      currentStyle = Math.floor(Math.random() * TOTAL_STYLES) + 1;
      loadZebraImage(currentStyle);
    }

    function downloadPFP() {
      const link = document.createElement('a');
      link.download = `stripes-zebra-${currentStyle}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.onload = function() {
      loadZebraImage(1);
    };
  </script>

</body>
</html>
