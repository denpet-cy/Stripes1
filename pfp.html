<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$STRIPES Cyberpunk PFP Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060709;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px 10px;
    }
    h1 {
      color: #00ffcc;
      font-size: 26px;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
      margin-bottom: 6px;
    }
    p { color: #8899a6; font-size: 14px; margin-bottom: 20px; }
    
    .card {
      background: #0f1117;
      border: 1px solid #1f2430;
      border-radius: 18px;
      padding: 16px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
    }

    #canvas-container {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
      background: #000;
      display: block;
    }

    .counter {
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .inputs { display: flex; flex-direction: column; gap: 10px; }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #00ffcc;
      background: #08090d;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      box-shadow: inset 0 0 8px rgba(0, 255, 204, 0.2);
    }

    .nav-buttons { display: flex; gap: 8px; }

    .btn {
      flex: 1;
      background: linear-gradient(135deg, #00ffcc, #ff007f);
      border: none;
      color: #000;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: #181b24; color: #00ffcc; border: 1px solid #00ffcc; }
    .btn-download { background: #00ffcc; color: #000; width: 100%; font-size: 16px; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>$STRIPES PFP GENERATOR</h1>
  <p>Kies jouw unieke Cyberpunk Neon Zebra avatar!</p>

  <div class="card">
    <div id="canvas-container">
      <canvas id="pfpCanvas" width="800" height="800"></canvas>
    </div>

    <div class="counter" id="styleCounter">Zebra Stijl 1 van 50</div>

    <div class="inputs">
      <input type="text" id="userHandle" placeholder="Voer je @handle in" value="@STRIPES" oninput="drawPFP()">
      
      <div class="nav-buttons">
        <button class="btn btn-secondary" onclick="changeStyle(-1)">◀ Vorige</button>
        <button class="btn" onclick="randomStyle()">🎲 Random</button>
        <button class="btn btn-secondary" onclick="changeStyle(1)">Volgende ▶</button>
      </div>

      <button class="btn btn-download" onclick="downloadPFP()">💾 Download HQ PFP</button>
    </div>
  </div>

      ctx.fillStyle = palette.bg;

        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, 800);
        ctx.moveTo(0, i); ctx.lineTo(800, i);
        ctx.stroke();
      }

      // Digital Rain Particles
      ctx.fillStyle = palette.sub + '44';
      for (let i = 0; i < 60; i++) {
        let x = (Math.sin(i * seed) * 0.5 + 0.5) * 800;
        let y = (Math.cos(i * seed * 2) * 0.5 + 0.5) * 800;
        ctx.fillRect(x, y, 4, 15);
      }

      // 2. Zebra Hoofd Basis (Silhouette)
      ctx.save();

      ctx.ellipse(140, -180, 35, 90, Math.PI / 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.moveTo(-120, -120);

      ctx.quadraticCurveTo(0, 270, 60, 220);
      ctx.quadraticCurveTo(150, 100, 120, -120);
      ctx.quadraticCurveTo(0, -200, -120, -120);

      ctx.fill();
      ctx.strokeStyle = palette.main;
      ctx.lineWidth = 4;
      ctx.stroke();

      // Neus
      ctx.fillStyle = '#050609';
      ctx.beginPath();
      ctx.ellipse(0, 180, 50, 35, 0, 0, Math.PI * 2);
      ctx.fill();
