<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$STRIPES — The Real Herd</title>
    <style>
        :root {
            --bg-color: #07070a;
            --card-bg: #111118;
            --neon-pink: #ff2a85;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --text-main: #f0f0f5;
            --text-muted: #9494a0;
            --border-color: #242433;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Neon Glow Background Effects */
        body::before {
            content: '';
            position: fixed;
            top: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: rgba(255, 42, 133, 0.12);
            filter: blur(80px);
            z-index: -1;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: rgba(0, 243, 255, 0.12);
            filter: blur(80px);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 30px 20px 10px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            margin: 10px 0 20px;
        }

        /* Tab Navigatie */
        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            color: var(--bg-color);
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            max-width: 850px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .tab-content.active {
            display: block;
        }

        /* Container Styling */
        .card-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
        }

        h2, h3 {
            color: var(--neon-cyan);
        }

        .home-title {
            font-size: 2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 42, 133, 0.4);
            margin-bottom: 15px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 20px 0;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }

        /* Contract Box */
        .ca-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--neon-cyan);
            border-radius: 10px;
            padding: 15px;
            margin: 25px 0;
            word-break: break-all;
        }

        .ca-title {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .ca-address {
            font-family: monospace;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        /* Links / Social Buttons Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .neon-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .neon-btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.4);
            transform: translateY(-2px);
        }

        .neon-btn.pump {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .neon-btn.pump:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.7);
        }
