<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Zebra | $STRIPES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050505;
            color: #fff;
            overflow-x: hidden;
        }

        h1, h2, h3, .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Neon Text & Box Shadows */
        .neon-text-pink {
            text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
        }
        .neon-text-cyan {
            text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff;
        }
        .neon-box-pink {
            box-shadow: 0 0 10px #ff00ff, inset 0 0 10px #ff00ff;
            border: 2px solid #ff00ff;
        }
        .neon-box-cyan {
            box-shadow: 0 0 10px #00ffff, inset 0 0 10px #00ffff;
            border: 2px solid #00ffff;
        }

        /* Video Background */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            /* Helderheid nog verder omhoog, contrast iets sterker */
            filter: brightness(1.4) contrast(1.15); 
        }
        .video-container iframe {
            width: 100vw;
            height: 56.25vw; /* 16:9 aspect ratio */
            min-height: 100vh;
            min-width: 177.77vh; /* 16:9 aspect ratio */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Bijna geen verduistering meer, video knalt eruit */
            background: rgba(0, 0, 0, 0.15);
            z-index: 0;
        }

        /* Glitch Effect */
        .glitch-hover:hover {
            animation: glitch 0.3s linear infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
