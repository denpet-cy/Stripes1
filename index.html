<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$STRIPES — The Real Herd & Dashboard</title>
    <style>
        :root {
            --bg-color: #12121c;
            --card-bg: #1a1a26;
            --neon-pink: #ff2a85;
            --neon-cyan: #00f3ff;
            --neon-green: #22c55e;
            --text-main: #ffffff;
            --text-muted: #b8b8c8;
            --border-color: #32324a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 30px 20px 10px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            margin: 10px 0 20px;
        }

        /* Tab Navigatie */
        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            color: var(--bg-color);
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.7);
        }

        /* Tab Content */
        .tab-content {
            display: none;
            max-width: 850px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .tab-content.active {
            display: block;
        }

        /* Container Styling */
        .card-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
        }

        .home-title {
            font-size: 2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 42, 133, 0.5);
            margin-bottom: 15px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        /* Contract Box */
        .ca-box {
            background: #0f0f17;
            border: 1px dashed var(--neon-cyan);
            border-radius: 10px;
            padding: 15px;
            margin: 25px 0;
            word-break: break-all;
        }

        .ca-title {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .ca-address {
            font-family: monospace;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        /* Social Buttons Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .neon-btn {
            background: #12121c;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .neon-btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.5);
            transform: translateY(-2px);
        }

        .neon-btn.pump {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .neon-btn.pump:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
        }

        /* Dashboard Specific Styling */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .metric-card {
            background: #12121c;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .metric-card h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--neon-cyan);
        }

        .progress-box {
            background: #12121c;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-bar-container {
            width: 100%;
            background: var(--border-color);
            border-radius: 9999px;
            height: 14px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            border-radius: 9999px;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Roadmap Styling */
        .roadmap-container {
            text-align: left;
            padding: 35px 30px;
            height: auto;
        }

        .phase-box {
            border-left: 3px solid var(--neon-pink);
            margin-bottom: 35px;
            padding-left: 20px;
        }

        .phase-box h3 {
            color: var(--neon-pink);
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .phase-subtitle {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .roadmap-container ul {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .roadmap-container li {
            margin-bottom: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .checks-title {
            font-weight: bold;
            color: var(--neon-cyan);
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .footer-note {
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            margin-top: 35px;
        }

        .footer-note p {
            font-style: italic;
            color: var(--text-main);
            margin-bottom: 8px;
        }
    </style>
</head>

            <button class="tab-btn" onclick="openTab(event, 'RoadmapTab')">Roadmap</button>

    </header>
