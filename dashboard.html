<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$STRIPES — Dashboard</title>
    <style>
        :root {
            --bg-color: #12121c;
            --card-bg: #1a1a26;
            --neon-cyan: #00f3ff;
            --neon-green: #22c55e;
            --text-main: #ffffff;
            --text-muted: #b8b8c8;
            --border-color: #32324a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .card-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px 25px;
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: left;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .metric-card {
            background: #12121c;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        .metric-card h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--neon-cyan);
        }
        .progress-box {
            background: #12121c;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .progress-bar-container {
            width: 100%;
            background: var(--border-color);
            border-radius: 9999px;
            height: 14px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            border-radius: 9999px;
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h2 style="text-align: center; color: var(--neon-cyan); margin-bottom: 25px;">🦓 Live On-Chain Dashboard</h2>
        
        <div class="progress-box">
            <div class="progress-header">
                <span style="font-weight: bold; color: var(--text-main);">Bonding Curve Progress</span>
                <span id="progress-text" style="font-weight: bold; color: var(--neon-green);">Laden...</span>
            </div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="metric-card">
                <h3>Market Cap (USD)</h3>
                <div class="metric-value" id="market-cap">Laden...</div>
            </div>
            <div class="metric-card">
                <h3>SOL Price</h3>
                <div class="metric-value" id="sol-price">Laden...</div>
            </div>
        </div>
    </div>

    <script>
        const mintAddress = "2ctBZn1je6q62p9jyCJmYsWpfSfH4QV8nHzTg2drpump";

        async function fetchLiveData() {
            try {
                const [tokenRes, solRes] = await Promise.all([
                    fetch(`https://api.dexscreener.com/latest/dex/tokens/${mintAddress}`),
                    fetch(`https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd`)
                ]);

                if (tokenRes.ok) {
                    const tokenData = await tokenRes.json();
                    if (tokenData && tokenData.pairs && tokenData.pairs.length > 0) {
                        const pair = tokenData.pairs[0];
                        const marketCap = pair.fdv || pair.marketCap;
                        if (marketCap) {
                            document.getElementById('market-cap').innerText = Number(marketCap).toLocaleString('en-US', {
                                style: 'currency',
                                currency: 'USD',
                                maximumFractionDigits: 0
                            });

                            // De berekening gecorrigeerd op basis van de werkelijke pomp.fun curve-grenzen
                            let progress = (marketCap / 18400) * 100;
                            if (progress > 100) progress = 100;
                            const progStr = progress.toFixed(1) + "%";
                            document.getElementById('progress-text').innerText = progStr;
                            document.getElementById('progress-bar').style.width = progStr;
                        }
                    }
                }

                if (solRes.ok) {
                    const solData = await solRes.json();
                    if (solData && solData.solana && solData.solana.usd) {
                        document.getElementById('sol-price').innerText = "$" + solData.solana.usd.toFixed(2);
                    }
                }
            } catch (error) {
                console.error("Fout bij ophalen live data:", error);
            }
        }

        fetchLiveData();
        setInterval(fetchLiveData, 15000);
    </script>
</body>
</html>
